[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulserank"
version = "0.1.0"
description = "Personalized content intelligence and multi-stage recommendation platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "pandas>=2.2.1",
    "numpy>=1.26.4",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.1",
    "lightgbm>=4.3.0",
    "sentence-transformers>=2.5.1",
    "faiss-cpu>=1.8.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "tqdm>=4.66.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
