version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulserank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulserank
      POSTGRES_PASSWORD: pulserank_secret_password
      POSTGRES_DB: pulserank_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulserank -d pulserank_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pulserank-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://pulserank:pulserank_secret_password@postgres:5432/pulserank_db
      ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pulserank-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
